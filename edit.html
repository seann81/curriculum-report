<!DOCTYPE html>
<!-- 파일: edit.html — 섹션별 입력폼 + 실시간 미리보기 + 프리필/되돌리기/적색표시 + 작성안내 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보고서 작성 — 교육과정 개편보고서</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="report.css">
</head>
<body data-page="edit">

<header class="topbar">
  <div class="brand">📝 <span id="hdrTitle">보고서 작성</span></div>
  <div class="row">
    <span id="statusBadge"></span>
    <a class="btn ghost sm" href="index.html">목록</a>
    <button class="btn sm" onclick="Edit.saveCurrent()">이 섹션 저장</button>
    <button class="btn sm" onclick="Edit.submit()">제출</button>
    <button class="btn sm" onclick="Edit.download()">HTML 다운로드</button>
  </div>
</header>

<div class="edit-wrap">
  <!-- 입력 -->
  <div class="edit-pane">
    <div class="tabbar" id="tabbar"></div>
    <div id="editBody"></div>
  </div>
  <!-- 미리보기(출력과 동일 마크업/CSS) -->
  <div class="preview-pane">
    <div class="report" id="preview"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="api.js"></script>
<script src="app.js"></script>
<script src="render.js"></script>
<script>
/* =============================================================================
 * edit.html 전용 컨트롤러
 * ========================================================================== */

/* [설정] 작성 안내 문구 — 교무팀이 매년 쉽게 고칠 수 있도록 텍스트 상수로 분리(§C2).
 *  이 안내는 "입력 화면에만" 표시되고 출력물에는 절대 실리지 않는다. */
var GUIDES = {
  sec1_1: { cite: '(교육부 기관평가인증) 대학의 교육목표·인재상 실현을 위해 교육과정을 구성하고, 학과 교육목표·전공역량과 전공교육과정이 연계되어 있는가?',
            tips: ['대학 열(이념·목적·U1~U6·인재상)은 고정값입니다.', '수정사항은 자동으로 빨간색 표시됩니다.'] },
  sec1_2: { cite: '(교육부 기관평가인증) 학과별 교육목표 및 전공능력(역량)과 전공교육과정은 연계되어 있는가?',
            tips: ['학과 교육목표는 3~4개만(6개 전부 옮겨쓰지 않음).', '배양역량에 C코드 병기 필수.', '성과증거는 학생이 내보이는 산출물(만족도·수강생 수 불가).', '비교과는 온/오프 구분 표기.'] },
  sec1_3: { cite: '(교육부 역량진단평가지표) 교육과정 편성의 적절성 — 수준단계별 체계화, 트렌드 반영여부.',
            tips: ['과목명만 기재. 1학년 과목도 필요시 상위 난이도 배치 가능.', '동시 개설학기는 학기마다 표기하되, "1학기+하계 동시 개설은 1번만 입력".', '주관/공통/타과활용 구분. 개·폐설 과목은 적색 표시.'] },
  sec2:   { cite: '(교육부 기관평가인증) 학생·사회·학문적 요구를 반영해 교육과정을 지속 개선하고 있는가?',
            tips: ['교육과정 변경이 있을 때만 작성. 없으면 "변경 없음" 체크.', '근거는 URL 기재(각주 자동번호). 교무처 제공 재학생 조사결과는 제출 제외.'] },
  sec3_1: { cite: '변경사항 코드 ①신설 ②폐지 ③과목명변경 ④학기변경 ⑤학년변경 ⑥학점변경 ⑦주관학과변경. 신설·폐지는 1행 1건.',
            tips: ['①신설 선택 시 별지1 교과목기획서 작성 필요.', '교육과정작성표(엑셀)와 상이하지 않도록 확인(엑셀 우선).'] },
  sec3_2: { cite: '팀티칭: 복수 교원이 교과목 제작·운영. 강의제작 참여교원만 원반 주담당 가능.', tips: [] },
  sec3_3: { cite: '[별지1] 핵심역량 2~4개 체크 → 각 내 하위역량 1개 이상. 개설 타당성은 정량 결과 필수.',
            tips: ['교과목 한글명은 띄어쓰기 없이 15자 이하.'] }
};

var TABS = [
  { id: 'sec1_1', label: '1-1 교육목표' },
  { id: 'sec1_2', label: '1-2 체계표' },
  { id: 'sec1_3', label: '1-3 로드맵' },
  { id: 'sec2',   label: '2 개편방향' },
  { id: 'sec3_1', label: '3-1 변경내역' },
  { id: 'sec3_2', label: '3-2 팀티칭' },
  { id: 'sec3_3', label: '별지1 기획서' }
];

var Edit = (function () {
  var state = { reportId: '', data: null, section: 'sec1_1', baseUpdatedAt: '', locked: false, canSubmit: true };
  var previewTimer = null;

  function init() {
    state.reportId = U.param('report');
    Auth.init(function () { load(); });
  }

  function load() {
    API.call('me', {}).then(function (m) { state.canSubmit = (m.me.submitYn === 'Y'); });
    API.call('getReport', { reportId: state.reportId }).then(function (d) {
      state.data = d;
      state.baseUpdatedAt = d.meta.updatedAt || '';
      state.locked = (d.meta.status === '잠금');
      U.el('hdrTitle').textContent = d.meta.year + '학년도 ' + d.meta.deptName;
      U.el('statusBadge').innerHTML = U.statusBadge(d.meta.status);
      recoverBackups();          // 서버 저장분보다 최신인 로컬 백업이 있으면 복구 제안(§7-2)
      renderTabs();
      show('sec1_1');
      refreshPreview();
    }).catch(function (e) { U.toast(e.message || '불러오기 실패', true); });
  }

  /* 미저장 로컬 백업 복구: 서버 최종수정보다 나중에 백업된 섹션이 있으면 한 번만 확인 후 반영. */
  function recoverBackups() {
    var serverMs = Date.parse(state.baseUpdatedAt || '') || 0;
    var pending = [];
    TABS.forEach(function (t) {
      var bk = Backup.load(state.reportId, t.id);
      if (bk && bk.t > serverMs + 1000 && bk.payload) pending.push({ sec: t.id, bk: bk });
    });
    if (!pending.length) return;
    var names = pending.map(function (p) { return p.sec; }).join(', ');
    if (confirm('저장되지 않은 임시 백업이 있습니다(' + names + ').\n복구할까요? (취소하면 서버 저장본을 사용)')) {
      pending.forEach(function (p) { state.data[p.sec] = p.bk.payload; });
      U.toast('임시 백업을 복구했습니다. 확인 후 [이 섹션 저장] 하세요.');
    } else {
      pending.forEach(function (p) { Backup.clear(state.reportId, p.sec); });
    }
  }

  function renderTabs() {
    U.el('tabbar').innerHTML = TABS.map(function (t) {
      return '<div class="tab' + (t.id === state.section ? ' active' : '') + '" onclick="Edit.show(\'' + t.id + '\')">' + t.label + '</div>';
    }).join('');
  }

  function show(sec) {
    state.section = sec; renderTabs();
    var host = U.el('editBody');
    host.innerHTML = guideHtml(sec) + '<div id="secForm"></div>' + toolbarHtml();
    Editors[sec](U.el('secForm'));
  }

  function guideHtml(sec) {
    var g = GUIDES[sec]; if (!g) return '';
    return '<details class="guide" open><summary>작성 안내 (출력물에는 포함되지 않음)</summary>' +
      '<div class="guide-body"><div class="cite">' + U.esc(g.cite) + '</div>' +
      '<ul>' + (g.tips || []).map(function (t) { return '<li>' + U.esc(t) + '</li>'; }).join('') + '</ul></div></details>';
  }
  function toolbarHtml() {
    return '<div class="toolbar"><button class="btn" onclick="Edit.saveCurrent()">이 섹션 저장</button>' +
      '<button class="btn ghost" onclick="Edit.refreshPreview()">미리보기 새로고침</button>' +
      (state.locked ? '<span class="warnmsg">마감된 보고서입니다(열람·다운로드만).</span>' : '') + '</div>';
  }

  /* 값 변경 시: 미리보기 갱신 + 로컬백업 */
  function touched() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(function () {
      refreshPreview();
      Backup.save(state.reportId, state.section, state.data[state.section]);
    }, 400);
  }
  function refreshPreview() {
    U.el('preview').innerHTML = Render.buildReport(state.data);
  }

  /* 저장 */
  function saveCurrent() {
    if (state.locked) return U.toast('마감된 보고서입니다.', true);
    var sec = state.section;
    var payload = Serialize[sec] ? Serialize[sec]() : state.data[sec];
    API.call('saveSection', { reportId: state.reportId, section: sec, payload: payload, baseUpdatedAt: state.baseUpdatedAt })
      .then(function (r) {
        state.baseUpdatedAt = r.updatedAt || state.baseUpdatedAt;
        Backup.clear(state.reportId, sec);
        U.toast('저장되었습니다.');
      }).catch(function (e) { U.toast(e.message || '저장 실패(로컬 백업 유지)', true); });
  }

  function submit() {
    if (!state.canSubmit) return U.toast('제출 권한이 없습니다(교수자에게 요청).', true);
    API.call('submitReport', { reportId: state.reportId }).then(function (r) {
      if (!r.submitted && r.warnings && r.warnings.length) {
        if (confirm('경고:\n- ' + r.warnings.join('\n- ') + '\n\n그래도 제출할까요?')) {
          API.call('submitReport', { reportId: state.reportId, confirm: true }).then(function () { U.toast('제출 완료'); load(); });
        }
      } else { U.toast('제출 완료'); load(); }
    }).catch(function (e) { U.toast(e.message || '제출 실패', true); });
  }

  function download() {
    API.call('exportPayload', { reportId: state.reportId }).then(function (d) { Render.download(d); });
  }

  return { init: init, show: show, saveCurrent: saveCurrent, submit: submit, download: download,
           refreshPreview: refreshPreview, state: state, touched: touched };
})();

/* ═══════════════════ 섹션 편집기 ═══════════════════ */
var Editors = {
  /* ── 1-1 ── */
  sec1_1: function (host) {
    var s = Edit.state.data.sec1_1;
    var h = '';
    h += listBlock('교육목표', s.goals, 'goal', '학과 교육목표');
    h += listBlock('인재상', s.talents, 'talent', '학과 인재상');
    var ovCh = s.overviewMeta && U.isChanged(s.overview, s.overviewMeta.prefillSnapshot);
    h += '<div class="field"><label>학과 교육과정 개요 ' +
         (s.overviewMeta && s.overviewMeta.isPrefilled ? (ovCh ? '<span class="badge-changed">수정됨</span> <button type="button" class="btn-revert" onclick="Editors._revertOverview()">되돌리기</button>' : '<span class="badge-prefill">전년도</span>') : '') +
         '</label><textarea class="' + (ovCh ? 'val-changed' : '') + '" oninput="Editors._ov(this.value)">' + U.esc(s.overview) + '</textarea></div>';
    // 직무역량
    h += '<div class="field"><label>④ 직무역량</label><div id="jobList"></div>' +
         '<button class="btn sm ghost" onclick="Editors._addJob()">+ 역량 추가</button></div>';
    host.innerHTML = h;
    renderList('goal'); renderList('talent'); renderJobs();
  },
  _ov: function (v) { Edit.state.data.sec1_1.overview = v; Edit.touched(); },
  _revertOverview: function () { var s = Edit.state.data.sec1_1; s.overview = s.overviewMeta.prefillSnapshot; Edit.show('sec1_1'); Edit.touched(); },
  _addJob: function () { Edit.state.data.sec1_1.jobCompetencies.push({ name: '', definition: '', prefillSnapshot: '', isPrefilled: false }); renderJobs(); },

  /* ── 1-2 ── */
  sec1_2: function (host) {
    var s = Edit.state.data.sec1_2;
    var uv = Edit.state.data.univ;
    var hs = (s.headMeta && s.headMeta.snapshot) || null;   // 프리필 스냅샷(없으면 null=프리필 아님)
    // HEAD 필드(한 줄 특성화·마이크로디그리)도 1-1/1-3처럼 전년도/수정됨 배지·적색·되돌리기 표시
    function headTag(field, cur, key) {
      if (!hs) return '';
      return (_ncmp(cur) !== _ncmp(hs[key] || ''))
        ? '<span class="badge-changed">수정됨</span> <button type="button" class="btn-revert" onclick="revertHead12(\'' + field + '\')">되돌리기</button>'
        : '<span class="badge-prefill">전년도</span>';
    }
    function headVc(cur, key) { return (hs && _ncmp(cur) !== _ncmp(hs[key] || '')) ? ' class="val-changed"' : ''; }
    var progStr = (s.micro && s.micro.programs || []).join(' | ');
    var linkedStr = (s.micro && s.micro.linked) || '';
    var h = '<div class="field"><label>학과 특성화 한 줄 ' + headTag('oneLine', s.oneLine, 'oneLine') + '</label><input type="text"' + headVc(s.oneLine, 'oneLine') + ' value="' + U.esc(s.oneLine) + '" oninput="Editors._s12(\'oneLine\',this.value)"></div>';
    h += '<div class="field"><label>학과 인재상</label><div class="muted" style="font-size:11.5px;margin:-2px 0 4px">1-1 교육목표·인재상에 입력한 인재상이 자동 반영됩니다(여기서는 수정할 수 없습니다). 대학 인재상 병기가 필요하면 1-1에서 괄호로 적으면 그대로 반영됩니다.</div><div id="t12List"></div></div>';
    h += '<div class="field"><label>본표 (G행, 최소 3 · 최대 6)</label><div id="g12List"></div>' +
         '<button class="btn sm ghost" onclick="Editors._addG()">+ 행 추가</button><div id="warn12" class="warnmsg"></div></div>';
    h += '<div class="field"><label>마이크로디그리·융합전공(과정명, 쉼표 구분) ' + headTag('microPrograms', progStr, 'microPrograms') + '</label>' +
         '<input type="text"' + headVc(progStr, 'microPrograms') + ' value="' + U.esc((s.micro && s.micro.programs || []).join(', ')) + '" oninput="Editors._micro(\'programs\',this.value)"></div>' +
         '<div class="field"><label>연계 목표·역량 ' + headTag('microLinked', linkedStr, 'microLinked') + '</label><input type="text"' + headVc(linkedStr, 'microLinked') + ' value="' + U.esc(linkedStr) + '" oninput="Editors._micro(\'linked\',this.value)"></div>';
    host.innerHTML = h;
    render12Talents(); renderG(uv);
  },
  _s12: function (k, v) { Edit.state.data.sec1_2[k] = v; Edit.touched(); },
  _micro: function (k, v) { var m = Edit.state.data.sec1_2.micro || (Edit.state.data.sec1_2.micro = {}); m[k] = (k === 'programs') ? v.split(',').map(function (x) { return x.trim(); }).filter(Boolean) : v; Edit.touched(); },
  _addG: function () { var r = Edit.state.data.sec1_2.rows; if (r.length >= 6) return U.toast('최대 6행입니다.', true); r.push({ no: 'G' + (r.length + 1), goal: '', uCodes: [], capability: '', cCodes: [], curriculum: { basic: '', advanced: '', applied: '' }, nonCurricular: '', evidence: '' }); renderG(Edit.state.data.univ); Edit.touched(); },

  /* ── 1-3 ── */
  sec1_3: function (host) {
    host.innerHTML = '<p class="muted">셀을 클릭해 과목을 추가하세요. 개·폐설 과목은 자동 적색 표시됩니다.</p><div id="rmGrid"></div>';
    renderRoadmap();
  },

  /* ── 2 ── */
  sec2: function (host) {
    var s = Edit.state.data.sec2;
    var m = Edit.state.data.meta;
    var h = '<label class="chk"><input type="checkbox" ' + (m.noChange2 ? 'checked' : '') + ' onchange="Editors._noChange(this.checked)"> 교육과정 변경 없음</label>';
    [['socialDemand', '① 산업체·사회적 요구 확인 방법 및 요구사항'], ['learnerDemand', '② 학습자 수요 확인 결과'], ['reformItems', '③ 개편 사항'], ['expectedEffect', '④ 개편 기대효과']].forEach(function (f) {
      h += '<div class="field"><label>' + f[1] + '</label><textarea oninput="Editors._s2(\'' + f[0] + '\',this.value)">' + U.esc(s[f[0]]) + '</textarea></div>';
    });
    h += '<div class="field"><label>근거문서(각주 자동번호)</label><div id="refList"></div>' +
      '<div class="row" style="margin-top:6px">' +
        '<button class="btn sm ghost" onclick="Editors._addRef()">+ URL 링크 추가</button>' +
        '<label class="btn sm ghost" style="margin:0;cursor:pointer">+ 파일 업로드<input type="file" style="display:none" onchange="Editors._uploadRef(this)"></label>' +
        '<span id="refUpMsg" class="muted" style="font-size:12px"></span>' +
      '</div>' +
      '<div class="muted" style="font-size:11.5px;margin-top:4px">업로드한 파일은 구글 드라이브의 「연도/학과」 폴더에 자동 저장되고, 위 목록에 링크로 추가됩니다.</div></div>';
    host.innerHTML = h; renderRefs();
  },
  _s2: function (k, v) { Edit.state.data.sec2[k] = v; Edit.touched(); },
  _uploadRef: function (input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var msg = U.el('refUpMsg');
    if (file.size > 25 * 1024 * 1024) { U.toast('파일이 너무 큽니다(25MB 이하만 가능).', true); input.value = ''; return; }
    if (msg) msg.textContent = '업로드 중… ' + file.name;
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1] || '';   // "data:...;base64,XXXX" 에서 XXXX 만
      API.call('uploadRef', { reportId: Edit.state.reportId, fileName: file.name, mimeType: file.type || 'application/octet-stream', dataBase64: b64 })
        .then(function (r) {
          input.value = '';
          if (r && r.mock) { if (msg) msg.textContent = '(연습모드) 실제 저장은 실가동 시 됩니다 — ' + (r.name || file.name); return; }
          Edit.state.data.sec2.refs.push({ label: r.name || file.name, url: r.url || '' });
          renderRefs(); Edit.touched();
          if (msg) msg.textContent = '저장 중… ' + (r.name || file.name);
          // 업로드 직후 2섹션(sec2)을 서버에 바로 저장 → 링크가 시트에 반영(미저장 이탈 시 고아 파일 방지)
          API.call('saveSection', { reportId: Edit.state.reportId, section: 'sec2', payload: Edit.state.data.sec2, baseUpdatedAt: Edit.state.baseUpdatedAt })
            .then(function (sr) { if (sr && sr.updatedAt) Edit.state.baseUpdatedAt = sr.updatedAt; if (msg) msg.textContent = '업로드·저장 완료 — ' + (r.name || file.name); })
            .catch(function (se) { if (msg) msg.textContent = '업로드됨(저장 실패 — 2섹션에서 [저장]을 눌러주세요): ' + (r.name || file.name); U.toast((se && se.message) || '저장 실패', true); });
        })
        .catch(function (e) { input.value = ''; if (msg) msg.textContent = ''; U.toast((e && e.message) || '업로드 실패', true); });

        ['①신설', '②폐지', '③과목명변경', '④학기변경', '⑤학년변경', '⑥학점변경', '⑦주관학과변경'].map(function (o) { return '<option ' + (r.changeType === o ? 'selected' : '') + '>' + o + '</option>'; }).join('') + '</select>' +
        '<label class="chk"><input type="checkbox" ' + (r.sameCourse ? 'checked' : '') + ' onchange="set31b(' + i + ',\'sameCourse\',this.checked)"> 동일교과</label>' +
        '<label class="chk"><input type="checkbox" ' + (r.certRelated ? 'checked' : '') + ' onchange="set31b(' + i + ',\'certRelated\',this.checked)"> 자격증관련</label></div>' +
      '<textarea placeholder="변경 사유(구체적으로)" oninput="set31(' + i + ',null,\'reason\',this.value)">' + U.esc(r.reason) + '</textarea>' +
      (r.changeType === '①신설' ? '<div class="warnmsg">①신설 → 별지1 교과목기획서 작성이 필요합니다.</div>' : '') +
      '</div>';
  }).join('');
}
function set31(i, grp, k, v) { var r = Edit.state.data.sec3_1[i]; if (grp) r[grp][k] = v; else r[k] = v; Edit.touched(); }
function set31c(i, v) { Edit.state.data.sec3_1[i].changeType = v; render31(); Edit.touched(); }
function set31b(i, k, v) { Edit.state.data.sec3_1[i][k] = v; Edit.touched(); }
function del31(i) { Edit.state.data.sec3_1.splice(i, 1); render31(); Edit.touched(); }

/* ── 3-2 ── */
function render32() {
  var arr = Edit.state.data.sec3_2; var host = U.el('t32'); if (!host) return;
  host.innerHTML = arr.map(function (r, i) {
    var t1 = r.t1 || (r.t1 = {}), t2 = r.t2 || (r.t2 = {});
    return '<div class="card" style="padding:12px;margin-bottom:10px"><div class="row"><b>연번 ' + (i + 1) + '</b><span class="x" onclick="del32(' + i + ')" style="margin-left:auto;cursor:pointer">✕</span></div>' +
      '<div class="row"><input placeholder="과목명" value="' + U.esc(r.name) + '" oninput="set32(' + i + ',null,\'name\',this.value)"><input placeholder="학점" style="width:80px" value="' + U.esc(r.credit) + '" oninput="set32(' + i + ',null,\'credit\',this.value)"></div>' +
      '<div class="row"><input placeholder="교원1 이름" value="' + U.esc(t1.name) + '" oninput="set32(' + i + ',\'t1\',\'name\',this.value)"><input placeholder="주차 ex 1~7주차" value="' + U.esc(t1.weeks) + '" oninput="set32(' + i + ',\'t1\',\'weeks\',this.value)"><label class="chk"><input type="checkbox" ' + (t1.isFullTime ? 'checked' : '') + ' onchange="set32b(' + i + ',\'t1\',this.checked)">전임</label></div>' +
      '<div class="row"><input placeholder="교원2 이름" value="' + U.esc(t2.name) + '" oninput="set32(' + i + ',\'t2\',\'name\',this.value)"><input placeholder="주차" value="' + U.esc(t2.weeks) + '" oninput="set32(' + i + ',\'t2\',\'weeks\',this.value)"><label class="chk"><input type="checkbox" ' + (t2.isFullTime ? 'checked' : '') + ' onchange="set32b(' + i + ',\'t2\',this.checked)">전임</label></div></div>';
  }).join('');
}
function set32(i, grp, k, v) { var r = Edit.state.data.sec3_2[i]; if (grp) r[grp][k] = v; else r[k] = v; Edit.touched(); }
function set32b(i, grp, v) { Edit.state.data.sec3_2[i][grp].isFullTime = v; Edit.touched(); }
function del32(i) { Edit.state.data.sec3_2.splice(i, 1); render32(); Edit.touched(); }

/* ── 별지1 ── */
function render33() {
  var arr = Edit.state.data.sec3_3; var host = U.el('t33'); if (!host) return;
  var uv = Edit.state.data.univ;
  host.innerHTML = arr.map(function (r, i) {
    var nameErr = r.courseNameKo && (/\s/.test(r.courseNameKo) || r.courseNameKo.length > 15);
    var coreTable = (uv.competencies || []).map(function (c) {
      var subs = (c.subs || []).map(function (sub) {
        var on = ((r.coreCompetencies[c.name] || []).indexOf(sub) > -1);
        return '<span class="codechip ' + (on ? 'on' : '') + '" onclick="toggleSub(' + i + ',\'' + c.name + '\',\'' + sub + '\')">' + U.esc(sub) + '</span>';
      }).join('');
      return '<tr><th>' + c.code + ' ' + U.esc(c.name) + '</th><td>' + subs + '</td></tr>';
    }).join('');
    return '<div class="card" style="padding:12px;margin-bottom:10px"><div class="row"><b>기획서 ' + (i + 1) + '</b><span class="x" onclick="del33(' + i + ')" style="margin-left:auto;cursor:pointer">✕</span></div>' +
      '<div class="row"><input placeholder="한글명(공백X,15자↓)" class="' + (nameErr ? 'val-changed' : '') + '" value="' + U.esc(r.courseNameKo) + '" oninput="set33(' + i + ',\'courseNameKo\',this.value)"><input placeholder="영문명" value="' + U.esc(r.courseNameEn) + '" oninput="set33(' + i + ',\'courseNameEn\',this.value)"></div>' +
      (nameErr ? '<div class="warnmsg">한글명은 띄어쓰기 없이 15자 이하여야 합니다.</div>' : '') +
      '<div class="row"><input placeholder="학점" style="width:70px" value="' + U.esc(r.credit) + '" oninput="set33(' + i + ',\'credit\',this.value)">' +
        '<select onchange="set33(' + i + ',\'grade\',this.value)"><option value="">학년</option>' + [['1', '1학년'], ['2', '2학년'], ['3', '3학년'], ['4', '4학년']].map(function (g) { return '<option value="' + g[0] + '"' + (parseInt(r.grade, 10) === Number(g[0]) ? ' selected' : '') + '>' + g[1] + '</option>'; }).join('') + '</select>' +
        '<select onchange="set33(' + i + ',\'type\',this.value)"><option ' + (r.type === '전공선택' ? 'selected' : '') + '>전공선택</option><option ' + (r.type === '교양선택' ? 'selected' : '') + '>교양선택</option></select>' +
        '<select onchange="set33(' + i + ',\'certRelated\',this.value)"><option value="N" ' + (r.certRelated === 'N' ? 'selected' : '') + '>자격증 N</option><option value="Y" ' + (r.certRelated === 'Y' ? 'selected' : '') + '>자격증 Y</option></select></div>' +
      '<div class="field"><label>개설학기</label>' + ['1학기', '하계', '2학기', '동계'].map(function (t) {
        return '<label class="chk"><input type="checkbox" ' + ((r.terms || []).indexOf(t) > -1 ? 'checked' : '') + ' onchange="toggleTerm(' + i + ',\'' + t + '\')"> ' + t + '</label>';
      }).join('') + '</div>' +
      '<div class="field"><label>핵심역량(2~4개 → 하위역량 1개↑)</label><table class="rm-table">' + coreTable + '</table></div>' +
      '<div class="field"><label>직무역량(쉼표 구분)</label><input value="' + U.esc((r.jobCompetencies || []).join(', ')) + '" oninput="set33list(' + i + ',\'jobCompetencies\',this.value)"></div>' +
      '<div class="field"><label>개설 타당성(정량 결과 필수)</label><textarea oninput="set33(' + i + ',\'rationale\',this.value)">' + U.esc(r.rationale) + '</textarea></div>' +
      '<div class="field"><label>과목 소개</label><textarea oninput="set33o(' + i + ',\'intro\',this.value)">' + U.esc(r.outline.intro) + '</textarea></div>' +
      '<div class="field"><label>개설 목적</label><textarea oninput="set33o(' + i + ',\'purpose\',this.value)">' + U.esc(r.outline.purpose) + '</textarea></div>' +
      '<div class="field"><label>교과 수준</label><input value="' + U.esc(r.outline.level) + '" oninput="set33o(' + i + ',\'level\',this.value)"></div>' +
      '<div class="field"><label>역량 연계성</label><textarea oninput="set33(' + i + ',\'linkage\',this.value)">' + U.esc(r.linkage) + '</textarea></div>' +
      '<div class="row"><input placeholder="관련 자격증(Y일 때)" value="' + U.esc(r.certs) + '" oninput="set33(' + i + ',\'certs\',this.value)"></div>' +
      '<div class="row"><select onchange="set33(' + i + ',\'similarExisting\',this.value)"><option value="N" ' + (r.similarExisting === 'N' ? 'selected' : '') + '>유사과목 N</option><option value="Y" ' + (r.similarExisting === 'Y' ? 'selected' : '') + '>유사과목 Y</option></select>' +
        '<input placeholder="유사 기존과목명" value="' + U.esc(r.similarName) + '" oninput="set33(' + i + ',\'similarName\',this.value)">' +
        '<select onchange="set33(' + i + ',\'sameCourse\',this.value)"><option value="N" ' + (r.sameCourse === 'N' ? 'selected' : '') + '>동일교과 N</option><option value="Y" ' + (r.sameCourse === 'Y' ? 'selected' : '') + '>동일교과 Y</option></select></div>' +
      '</div>';
  }).join('');
}
function set33(i, k, v) { Edit.state.data.sec3_3[i][k] = v; if (k === 'courseNameKo') render33(); Edit.touched(); }
function set33o(i, k, v) { Edit.state.data.sec3_3[i].outline[k] = v; Edit.touched(); }
function set33list(i, k, v) { Edit.state.data.sec3_3[i][k] = v.split(',').map(function (x) { return x.trim(); }).filter(Boolean); Edit.touched(); }
function toggleTerm(i, t) { var arr = Edit.state.data.sec3_3[i].terms || (Edit.state.data.sec3_3[i].terms = []); var p = arr.indexOf(t); if (p > -1) arr.splice(p, 1); else arr.push(t); Edit.touched(); }
function toggleSub(i, name, sub) {
  var core = Edit.state.data.sec3_3[i].coreCompetencies; var arr = core[name] || (core[name] = []);
  var p = arr.indexOf(sub); if (p > -1) arr.splice(p, 1); else arr.push(sub);
  if (!arr.length) delete core[name];
  render33(); Edit.touched();
}
function del33(i) { Edit.state.data.sec3_3.splice(i, 1); render33(); Edit.touched(); }

/* ═══════════════════ 저장용 직렬화(§6-3 payload) ═══════════════════ */
var Serialize = {
  sec1_1: function () {
    var s = Edit.state.data.sec1_1;
    return {
      goals: s.goals.map(function (g) { return { value: g.value, prefillSnapshot: g.prefillSnapshot }; }),
      talents: s.talents.map(function (t) { return { value: t.value, prefillSnapshot: t.prefillSnapshot }; }),
      overview: s.overviewMeta ? { value: s.overview, prefillSnapshot: s.overviewMeta.prefillSnapshot } : { value: s.overview, prefillSnapshot: '' },
      jobCompetencies: s.jobCompetencies.map(function (j) { return { name: j.name, definition: j.definition, prefillSnapshot: j.prefillSnapshot }; })
    };
  },
  sec1_2: function () {
    // 인재상은 1-1을 단일 원본으로 사용 — 저장 시 1-1 값으로 동기화(SEC1_2 시트 capability 열도 1-1과 일치 유지)
    var src = Edit.state.data.sec1_2;
    var t11 = (Edit.state.data.sec1_1 && Edit.state.data.sec1_1.talents) || [];
    var s12 = {};                                   // 라이브 상태 변이 방지: 얕은 복사 후 talents만 교체
    for (var k in src) { if (src.hasOwnProperty(k)) s12[k] = src[k]; }
    s12.talents = t11.map(function (t) { return (t && typeof t === 'object') ? t.value : t; });
    return s12;
  },
  sec1_3: function () { return { cells: Edit.state.data.sec1_3.cells }; },
  sec2:   function () { return Edit.state.data.sec2; },
  sec3_1: function () { return { rows: Edit.state.data.sec3_1 }; },
  sec3_2: function () { return { rows: Edit.state.data.sec3_2 }; },
  sec3_3: function () { return { rows: Edit.state.data.sec3_3 }; }
};

document.addEventListener('DOMContentLoaded', Edit.init);
</script>
</body>
</html>
