<!DOCTYPE html>
<!-- 파일: index.html — 로그인 · 보고서 목록 · 제출현황 대시보드 · (관리자)연도개시/계정관리 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육과정 개편보고서 작성 시스템</title>
<link rel="stylesheet" href="ui.css">
</head>
<body data-page="index">

<header class="topbar">
  <div class="brand">📘 교육과정 개편보고서 <span class="muted">작성 시스템</span></div>
  <div id="who" class="who"></div>
</header>

<!-- 로그인 -->
<section id="loginBox" class="loginbox">
  <h2>로그인</h2>
  <p class="muted">서울사이버대학교 <b>iscu.ac.kr</b> 계정으로 로그인하세요.</p>
  <div id="gsiButton"></div>
</section>

<!-- 본문 -->
<main id="app" style="display:none">

  <!-- 관리자 패널 -->
  <section id="adminPanel" class="card" style="display:none">
    <h3>관리자 도구</h3>
    <div class="row">
      <label>연도 개시 <input id="openYear" type="number" placeholder="2027" style="width:90px"></label>
      <div id="deptChecks" class="chks"></div>
      <button class="btn" onclick="IndexPage.openYear()">보고서 생성</button>
      <button class="btn ghost" onclick="IndexPage.openAccounts()">계정 관리</button>
    </div>
  </section>

  <!-- 제출현황 대시보드 -->
  <section class="card">
    <h3>보고서 목록 · 제출현황</h3>
    <table class="grid">
      <thead><tr><th>연도</th><th>학과</th><th>상태</th><th>최종수정</th><th>제출일</th><th>작업</th></tr></thead>
      <tbody id="reportBody"></tbody>
    </table>
  </section>
</main>

<!-- 계정관리 모달 -->
<div id="accountModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3>담당자 계정 관리 (ACCESS)</h3>
    <p class="muted">시트를 직접 편집해도 즉시 반영됩니다. 삭제 대신 사용여부(useYn)=N 으로 관리하세요.</p>
    <div class="form-grid">
      <input id="u_email" placeholder="이메일 @iscu.ac.kr">
      <input id="u_name" placeholder="이름">
      <select id="u_role"><option value="professor">교수자</option><option value="assistant">조교</option><option value="admin">관리자</option></select>
      <input id="u_dept" placeholder="학과코드(SW / *)">
      <select id="u_submit"><option value="Y">제출가능</option><option value="N">제출불가</option></select>
      <select id="u_use"><option value="Y">사용</option><option value="N">미사용</option></select>
      <button class="btn" onclick="IndexPage.saveUser()">등록/수정</button>
    </div>
    <table class="grid">
      <thead><tr><th>이메일</th><th>이름</th><th>권한</th><th>학과</th><th>제출</th><th>사용</th></tr></thead>
      <tbody id="userBody"></tbody>
    </table>
    <div class="right"><button class="btn ghost" onclick="document.getElementById('accountModal').style.display='none'">닫기</button></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
